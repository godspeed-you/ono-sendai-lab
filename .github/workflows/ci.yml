# CI for ono-sendai-lab (LAB-092). Same scripts as local; pinned actions;
# least privilege; no AWS secrets; nothing here ever contacts AWS APIs.
name: ci

on:
  push:
    branches: [implementation, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (static, unit, contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the hashed gate toolchain (no emulator)
        run: scripts/bootstrap.sh --dev-tools-only
      - name: Gate
        run: scripts/gate.sh

  acceptance:
    name: acceptance (real emulator, namespaces, cgroups)
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bubblewrap (operator-approved 2026-11-24, ephemeral hosted runner only)
        # The only privileged step: the distribution package, nothing else.
        # No sysctl, AppArmor, network or service change is made.
        run: sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Runner qualification
        # The runner is qualified only if bubblewrap, a systemd user manager
        # and XDG_RUNTIME_DIR are present; whether bubblewrap may create the
        # unprivileged namespaces and whether cgroup limits are enforced is
        # then proven by `aws-lab doctor` inside scripts/acceptance.sh.
        run: |
          set -u
          missing=""
          command -v bwrap >/dev/null || missing="$missing bubblewrap"
          command -v gpg >/dev/null || missing="$missing gpg"
          command -v dpkg-deb >/dev/null || missing="$missing dpkg-deb"
          systemctl --user show-environment >/dev/null 2>&1 || missing="$missing systemd-user-manager"
          [ -n "${XDG_RUNTIME_DIR:-}" ] || missing="$missing XDG_RUNTIME_DIR"
          if [ -n "$missing" ]; then
            echo "::error title=acceptance runner not qualified::missing:$missing (see docs/operations/ci-runner.md)"
            exit 1
          fi
      - name: Bootstrap (pinned, signature-verified emulator; hashed venvs)
        run: scripts/bootstrap.sh --dev
      - name: Acceptance
        run: scripts/acceptance.sh
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-evidence
          path: docs/evidence/raw/
          if-no-files-found: ignore
          retention-days: 14
